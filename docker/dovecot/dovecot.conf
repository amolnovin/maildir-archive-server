# ============================================================
#  Maildir Archive Server — پیکربندی اصلی Dovecot
#  هدف: دسترسی مستقیم IMAP به بکاپ‌های Maildir دایرکت‌ادمین
#  نسخه هدف: Dovecot 2.4.x  (Alpine 3.22)
#  ⚠️ نحو (syntax) نسخه ۲.۴ با ۲.۳ فرق دارد؛ این فایل برای ۲.۴ است.
# ============================================================

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3
listen = *
base_dir = /var/run/dovecot/
instance_name = maildir-archive

# ---- لاگ ----
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes

# ---- محل ذخیره ایمیل ----
# ساختار: /srv/mail/<domain>/<user>/Maildir
mail_driver = maildir
mail_path = /srv/mail/%{user | domain}/%{user | username}/Maildir
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = vmail

namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

!include conf.d/10-auth.conf
!include conf.d/10-ssl.conf
!include conf.d/10-master.conf
!include conf.d/20-imap.conf

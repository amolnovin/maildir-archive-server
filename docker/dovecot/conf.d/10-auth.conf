# ---- احراز هویت (نحو Dovecot 2.4) ----
# چون این سرور آرشیو لوکال است، cleartext auth روی شبکه داخلی مجاز است.
# برای استفاده روی شبکه عمومی این را no کنید.
auth_allow_cleartext = yes
auth_mechanisms = plain login
auth_username_format = %{user | lower}

# کاربران در فایل /etc/dovecot/users نگهداری می‌شوند
# قالب هر خط:
#   user@domain:{SHA512-CRYPT}hash:5000:5000::/srv/mail/domain/user
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = SHA512-CRYPT
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  fields {
    uid = 5000
    gid = 5000
    home = /srv/mail/%{user | domain}/%{user | username}
  }
}
